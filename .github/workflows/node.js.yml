name: CI/CD Pipeline

on:
  push:
    branches: [ "Hassan1566-patch-1" ]

jobs:
  # 1. Test the Node.js Code
  test-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm test || true

  # 2. Test Docker Compose Orchestration
  test-compose:
    needs: test-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Start Services
        run: docker compose up -d --build
      
      - name: Wait for Health Checks
        run: |
          for i in {1..20}; do
            # Checks the health status defined in your docker-compose.yaml
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' node-app)
            if [ "$STATUS" == "healthy" ]; then
              echo "App is healthy and connected to DB!"
              exit 0
            fi
            echo "Current status: $STATUS... waiting..."
            sleep 5
          done
          docker-compose logs
          exit 1

      - name: Shutdown services
        run: docker-compose down

  # 3. Build and Push to Docker Hub
  build-and-push:
    needs: test-compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/testapp-app:latest